name: Synthetic native renderer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch pinned assembler tool bundle
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/BartmanAbyss/vscode-amiga-debug.git "$RUNNER_TEMP/amiga-tools"
          git -C "$RUNNER_TEMP/amiga-tools" checkout 055097bba74dd1b2f764dcb90781d2017bd1d499 -- bin/linux/vasmm68k_mot
          chmod +x "$RUNNER_TEMP/amiga-tools/bin/linux/vasmm68k_mot"
          echo "VASM=$RUNNER_TEMP/amiga-tools/bin/linux/vasmm68k_mot" >> "$GITHUB_ENV"
      - run: bash port/tools/recovery_audio_clock_public.sh
      - run: python port/tests/recovery_play_clock_compare_test.py
      - run: bash port/tools/recovery_bank_loader_queue5_public.sh
      - run: bash port/tools/recovery_bank_loader_sfx_public.sh
      - run: bash port/tools/recovery_bank_loader_envelope_public.sh
      - run: bash port/tools/recovery_bank_loader_scroll_status_public.sh
      - run: bash port/tools/recovery_bank_loader_video5_public.sh
      - run: bash port/tools/recovery_bank_loader_play_public.sh
      - run: bash port/tools/recovery_bank_loader_input_public.sh
      - run: bash port/tools/recovery_stage_background_public.sh
      - run: bash tools/test_stage_load_public.sh
      - run: bash tools/test_stage_foundation_public.sh
      - run: bash tools/test_redraw_public.sh
      - run: bash tools/test_live_scene_assembly_public.sh
      - run: bash tools/test_background_public.sh
      - run: bash tools/test_profile_input_public.sh
      - run: bash tools/test_public.sh
